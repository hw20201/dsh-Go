# PR 入口门禁——CONTRIBUTING.md「暂不接受外部 PR」的 CI 落地。
# 逻辑在 .github/scripts/pr-intake/，本文件只编排。
# Manual-only; automatic PR triggers are disabled.
name: PR Gate

on:
  workflow_dispatch:

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  check-contributor:
    if: github.repository == 'ccch1mneyyy/dsh-Go'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout default branch only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check pull request intake policy
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = await import('node:url')
            const { join } = await import('node:path')
            const { runPrGate } = await import(pathToFileURL(join(
              process.env.GITHUB_WORKSPACE,
              '.github/scripts/pr-intake/gate.mjs',
            )).href)
            await runPrGate({ github, context, core })
